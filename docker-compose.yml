services:
  db:
    image: postgres:16-alpine
    container_name: pdash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdash
      POSTGRES_PASSWORD: pdash
      POSTGRES_DB: pdash
    ports:
      - '5432:5432'
    volumes:
      - pdash-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pdash -d pdash']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pdash-db-data:
